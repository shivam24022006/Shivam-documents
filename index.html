<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shivam Documents</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172033}
header{padding:32px 18px;background:linear-gradient(120deg,#102044,#2563eb);color:#fff}
.wrap,main{max-width:960px;margin:auto}h1{margin:0;font-size:clamp(26px,5vw,40px)}header p{color:#dbeafe;margin:8px 0 0}
main{padding:22px 16px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filter{padding:8px 13px;border:1px solid #d5deea;border-radius:99px;background:white;cursor:pointer}.filter.active{background:#2563eb;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{padding:18px;background:white;border:1px solid #e2e8f0;border-radius:16px}.card h2{font-size:18px;margin:8px 0}.card p{color:#64748b;font-size:14px}.btn{display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:10px 13px;border-radius:9px;margin:4px 5px 0 0}.btn.alt{background:#eaf0ff;color:#1d4ed8}.empty{padding:24px;text-align:center;color:#64748b;background:#fff;border-radius:12px;grid-column:1/-1}
footer{text-align:center;color:#64748b;padding:24px;font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><h1>📚 Shivam Documents</h1><p>Search, read and download public documents.</p></div></header>
<main>
<input id="search" type="search" placeholder="Search documents or subjects…">
<div class="filters" id="filters"></div><section class="grid" id="list"></section>
</main><footer>Shivam Documents · Public PDF Library</footer>
<script>
// The PDF file must be uploaded in the same repository folder as this index.html.
// Rename your uploaded PDF to: pw-nsat-formula-book.pdf
const docs=[{title:"PW NSAT Formula Book",category:"Study Material",description:"Formula book PDF",file:"pw-nsat-formula-book.pdf"},{
  title:"Narration",
  category:"Study Material",
  description:"English Grammer",
  file:"Narration.pdf"
}];
let active="All";
const search=document.getElementById("search"),filters=document.getElementById("filters"),list=document.getElementById("list");
const cats=["All",...new Set(docs.map(x=>x.category))];
function drawFilters(){filters.innerHTML=cats.map(c=>`<button class="filter ${c===active?"active":""}" data-cat="${c}">${c}</button>`).join("");filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawFilters();draw();});}
function draw(){const q=search.value.trim().toLowerCase();const arr=docs.filter(d=>(active==="All"||d.category===active)&&`${d.title} ${d.category} ${d.description}`.toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(d=>`<article class="card"><div style="font-size:28px">📄</div><h2>${d.title}</h2><p>${d.category} · ${d.description}</p><a class="btn" href="${d.file}" target="_blank" rel="noopener">Read PDF</a><a class="btn alt" href="${d.file}" download>Download</a></article>`).join(""):`<div class="empty">No documents found.</div>`;}
search.addEventListener("input",draw);drawFilters();draw();
</script></body></html>
